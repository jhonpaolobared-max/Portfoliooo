<!DOCTYPE html>
<html>
<head>
    <title>Jhon Paolo Bared | Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fbff;
            color: #334155;
        }

        /* NAVIGATION */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 3px 15px #94a3b833;
        }

        nav a {
            color: #475569;
            text-decoration: none;
            margin: 0 14px;
            font-weight: bold;
            font-size: 17px;
        }

        nav a:hover {
            color: #6366f1;
        }

        /* HOME */
        .home {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
        }

        .profile {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid white;
            box-shadow: 0 10px 30px #6366f133;
        }

        .home h1 {
            font-size: 52px;
            color: #334155;
            margin: 20px 0 10px;
        }

        .home h2 {
            font-size: 25px;
            color: #6366f1;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            margin: 10px;
            border-radius: 30px;
            background: #6366f1;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
            transition: .3s;
            box-shadow: 0 5px 15px #6366f144;
        }

        .btn:hover {
            transform: translateY(-5px);
            background: #4f46e5;
        }

        /* SECTIONS */
        section {
            max-width: 1000px;
            margin: auto;
            padding: 90px 30px;
        }

        section h2 {
            text-align: center;
            font-size: 34px;
            color: #6366f1;
            margin-bottom: 40px;
        }

        /* CARDS */
        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px #94a3b826;
            font-size: 18px;
            border: 1px solid #e0e7ff;
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-7px);
            box-shadow: 0 12px 30px #6366f126;
        }

        /* SKILLS */
        .skills {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .skill {
            background: white;
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 8px 20px #94a3b826;
            font-size: 18px;
            border: 1px solid #e0e7ff;
            transition: .3s;
        }

        .skill:hover {
            transform: scale(1.03);
            border-color: #a5b4fc;
        }

        .skill span {
            font-weight: bold;
            font-size: 20px;
        }

        .bar {
            height: 10px;
            background: #e2e8f0;
            border-radius: 10px;
            margin-top: 15px;
        }

        .bar div {
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #818cf8);
            border-radius: 10px;
        }

        /* PROJECT */
        .project {
            border-left: 7px solid #818cf8;
            background: #ffffff;
        }

        .project h3 {
            font-size: 25px;
            color: #4f46e5;
        }

        .project li {
            margin: 12px 0;
        }

        /* CONTACT */
        .contact {
            text-align: center;
            background: linear-gradient(135deg, #eff6ff, #f5f3ff);
        }

        .contact a {
            color: #6366f1;
            font-weight: bold;
            font-size: 19px;
        }

        /* FOOTER */
        footer {
            background: #e0e7ff;
            color: #475569;
            text-align: center;
            padding: 30px;
        }

        /* MOBILE */
        @media(max-width: 600px) {

            .home h1 {
                font-size: 36px;
            }

            .home h2 {
                font-size: 20px;
            }

            .profile {
                width: 170px;
                height: 170px;
            }

            .skills {
                grid-template-columns: 1fr;
            }

            nav a {
                font-size: 13px;
                margin: 5px;
            }
        }
    </style>
</head>

<body>

<!-- NAVIGATION -->

<nav>
    <a href="#home">Home
